<style>
  body{font-family:Inter,system-ui,sans-serif}
  .brand{font-family:'Bricolage Grotesque',Inter,sans-serif}
  :root{--acc:249,115,22;--glass:rgba(15,23,42,.55);--glass-hi:rgba(30,41,59,.6);--line:rgba(88,112,160,.38);--line-hi:rgba(112,142,205,.58);--blue:59,100,180;--r:.75rem}
  .inp{width:100%;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:.5rem .8rem;color:#f1f5f9;font-size:.875rem;color-scheme:dark;transition:border-color .15s,box-shadow .15s,background .15s}
  .inp:hover{border-color:var(--line-hi)}
  .inp:focus,.inp:focus-visible{outline:none;border-color:rgba(var(--blue),.8);box-shadow:0 0 0 3px rgba(var(--blue),.2)}
  .inp-date{display:flex;align-items:stretch;padding:0;background:rgba(43,47,60,.78);border:1.5px solid rgba(37,70,130,.9);cursor:pointer;overflow:hidden}
  .inp-date:hover{border-color:rgba(70,110,190,.95)}
  .inp-date .cal-txt{flex:1;padding:.55rem .9rem;text-align:left}
  .inp-date .cal-ico{display:grid;place-items:center;width:2.75rem;border-left:1px solid rgba(100,116,139,.4);background:rgba(255,255,255,.03)}
  .panel-filtros{background:rgba(10,14,22,.55);border:1px solid rgba(71,85,105,.25);border-radius:1rem;padding:.75rem .9rem}
  .inp:disabled{opacity:.55;cursor:not-allowed}
  .btn{border-radius:var(--r);padding:.5rem .95rem;font-size:.875rem;font-weight:600;transition:background .15s,border-color .15s,box-shadow .15s}
  .btn-p{background:rgb(var(--acc));color:#0f172a;border:1px solid rgba(255,255,255,.12);box-shadow:0 4px 14px rgba(var(--acc),.22)}
  .btn-p:hover{background:#fb923c;box-shadow:0 4px 18px rgba(var(--acc),.34)}
  .btn-s{background:var(--glass-hi);color:#e2e8f0;border:1px solid var(--line)}
  .btn-s:hover{background:rgba(51,65,85,.65);border-color:var(--line-hi)}
  .btn-s[aria-pressed="true"]{border-color:rgba(var(--acc),.5);color:#fdba74}
  .btn:focus-visible,.nav:focus-visible{outline:2px solid rgba(var(--acc),.8);outline-offset:2px}
  th{font-weight:500;text-align:left;padding:.6rem .75rem;color:#94a3b8;font-size:.8rem;white-space:nowrap}
  td{padding:.6rem .75rem;border-top:1px solid #1e293b}
  .nav{display:flex;align-items:center;gap:.65rem;width:100%;padding:.55rem .75rem;border-radius:.85rem;color:#94a3b8;font-size:.875rem;text-align:left;border:1px solid transparent;transition:background .15s,color .15s,box-shadow .15s}
  .nav:hover{background:rgba(148,163,184,.08);color:#e2e8f0}
  .nav.on{background:linear-gradient(145deg,rgba(251,146,60,.92),rgba(234,110,30,.82));color:#1a1206;font-weight:600;border-color:rgba(253,186,116,.45);box-shadow:0 0 22px rgba(var(--acc),.45),0 0 4px rgba(var(--acc),.6),inset 0 1px 0 rgba(255,255,255,.28)}
  .pill{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.75rem;font-weight:600}
  .g{background:#064e3b;color:#6ee7b7}.y{background:#713f12;color:#fde047}.r{background:#7f1d1d;color:#fca5a5}
  .o{background:#7c2d12;color:#fdba74}.s{background:#334155;color:#e2e8f0}
  .stk th{background:#0f172a}
  .nav.hidden{display:none}
  .cbx .inp{background:rgba(19,28,38,.8)}
  .btn.pilltab{border-radius:999px}
  .side-ico{width:1.5rem;text-align:center;flex:none}
  @media (min-width:768px){
    #side{position:fixed;top:0;bottom:0;left:0;width:3.75rem;padding-left:.5rem;padding-right:.5rem;overflow-x:hidden;transition:width .2s ease,box-shadow .2s ease}
    #side:hover,#side.pinned{width:15rem}
    #side:hover:not(.pinned){box-shadow:0 0 44px rgba(0,0,0,.3)}
    main{margin-left:3.75rem;transition:margin-left .2s ease}
    #side.pinned ~ main{margin-left:15rem}
    #side .nav{gap:0;white-space:nowrap;padding-left:.625rem;padding-right:.625rem}
    .side-lbl{margin-left:.65rem;max-width:14rem;overflow:hidden;transition:opacity .2s ease,max-width .2s ease,margin .2s ease}
    .side-hide{max-width:14rem;overflow:hidden;white-space:nowrap;transition:opacity .2s ease,max-width .2s ease}
    #side:not(:hover):not(.pinned) .side-lbl,#side:not(:hover):not(.pinned) .side-hide{opacity:0;max-width:0;margin-left:0;padding-left:0;padding-right:0;pointer-events:none}
    #side:not(:hover):not(.pinned) #planInd,#side:not(:hover):not(.pinned) .licind{display:none}
  }
  #ficha{display:none}
  @page{size:letter;margin:12mm}
  @media print{
    body>*:not(#ficha){display:none!important}
    aside,header,#topbar,#view,#modal,#login,#bloqueo,#pinModal,#toast{display:none!important}
    body{background:#fff!important}
    #ficha button,#ficha .no-print{display:none!important}
    #ficha,#ficha *{color:#000!important}
    #ficha .pill{background:none!important;padding:0}
    #ficha th{background:#eee!important}
    #ficha{display:block!important;color:#000;background:#fff;padding:0;font-size:11px;line-height:1.35}
    #ficha table{width:100%;border-collapse:collapse;margin:6px 0}
    #ficha td,#ficha th{border:1px solid #999;color:#000;padding:3px 6px;text-align:left;background:none;font-size:11px}
    #ficha th{background:#eee;font-weight:700}
    .doc-h{display:flex;align-items:center;gap:12px;border-bottom:2px solid #f97316;padding-bottom:8px;margin-bottom:10px}
    .firmas{display:flex;gap:28px;margin-top:44px;page-break-inside:avoid}
    .firma{flex:1;border-top:1px solid #000;padding-top:4px;text-align:center;font-size:10px}
    .doc-legal{margin-top:16px;font-size:9px;font-style:italic;text-align:center;color:#444}
    .doc-pie{margin-top:18px;border-top:1px solid #bbb;padding-top:6px;font-size:9px;color:#555;text-align:center}
  }
</style>
