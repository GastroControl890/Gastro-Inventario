<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | Gastro-Stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .brand { font-family: 'Bricolage Grotesque', sans-serif; }
    </style>
</head>
<body class="bg-[#070911] text-white min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-[#0f1523] border border-slate-800 rounded-2xl p-8 shadow-2xl">
        
        <!-- Logo / Título -->
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 font-bold text-2xl brand mx-auto mb-3 shadow-lg shadow-emerald-500/20">
                G
            </div>
            <h1 class="brand text-2xl font-bold tracking-tight">Gastro-Stock</h1>
            <p class="text-xs text-slate-400 mt-1">Ingresa a tu plataforma operativa</p>
        </div>

        <!-- Formulario que manda directo a app.html -->
        <form action="app.html" method="GET" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Usuario o Correo</label>
                <input type="text" required placeholder="tu.correo@restaurante.com" 
                       class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-600 text-sm focus:outline-none focus:border-emerald-500 transition-colors">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Contraseña</label>
                <input type="password" required placeholder="••••••••" 
                       class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-700 text-white placeholder-slate-600 text-sm focus:outline-none focus:border-emerald-500 transition-colors">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-emerald-600/30 text-sm mt-2">
                Entrar al sistema
            </button>
        </form>

        <!-- Enlace para regresar a la portada -->
        <div class="text-center mt-6">
            <a href="index.html" class="text-xs text-slate-500 hover:text-slate-300 transition-colors">
                ← Regresar a la página principal
            </a>
        </div>

    </div>

</body>
</html>
